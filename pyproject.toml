[tool.pytest.ini_options]
# 2026-08-28：测试单根合并，root tests/ 的测试代码已并入 apps/api/tests/
# （文件名碰撞的一个改名保留，冲突的旧夹具改名后一并搬入 conftest.py）。
# `tests/` 目录本身仍在——`tests/fixtures/documents/` 是共享 E2E 语料，不是
# 测试代码，pytest 不会从中收集用例（没有 test_*.py），保留不影响单根。
testpaths = ["apps/api/tests"]
pythonpath = ["."]
# 默认排除 e2e（真实模型调用）和 slow（整份文档解析/快照回放）。
# **CI 不用这个默认值**——`.github/workflows/deploy.yml` 显式传 `-m "not e2e"`，
# 把 slow 那批跑全。所以这条是"研发循环快一点"，不是"门禁少测一点"：
# 部署闸门的覆盖面一行没减。本地想跑全量：`pytest -m "not e2e"`。
# `--dist loadfile`：按**文件**分发，同一个文件的用例留在同一个 worker 上并保持
# 顺序。默认的 `--dist load` 打散到不同进程，`test_bql_e2e.py` 就会红——那一整个文件
# 是前面的用例建数据、后面的用例读，**耦合跨类**（先试 loadscope 按类分发，仍有 2 个
# 红在不同类里），所以必须按文件。这是 xdist 暴露出来的既有耦合，不是它引入的：
# 串行时靠"恰好按顺序跑"掩盖着。真要解耦是另一件事，别顺手塞进这轮。
addopts = "-m 'not e2e and not slow' -n auto --dist loadfile"
markers = [
    "e2e: end-to-end tests against real Qwen-VL API (opt-in: pass -m e2e or --override-ini)",
    "slow: parses whole documents or replays Paddle snapshots — minutes, not seconds",
]
