[project]
name = "bid-compare"
version = "0.1.0"
description = "MEMPAS 机电材料查询比价分析系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "xlrd>=2.0.2",
    "numpy>=2.0.0",
    "python-multipart>=0.0.18",
    # <3.6.0: 2026-08-29 部署镜像的 pip 源（阿里云 PyPI 镜像，见
    # apps/api/Dockerfile）还没同步到 3.6.0，uv 在本地解析用的是官方 PyPI，
    # 两边索引不一致导致 CI 构建报 "No matching distribution"（build 33240594361）。
    # 镜像追上后可以去掉这个上限。
    "openai>=1.30.0,<3.6.0",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "dashscope>=1.20.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[project.scripts]
mempas = "uvicorn:main"

[tool.uv]
# 2026-08-29：部署镜像的 pip 源（阿里云 PyPI 镜像，见 apps/api/Dockerfile）比
# 官方 PyPI（uv 本地解析用的索引）落后几天——本地能解析出的最新版本，镜像上
# 常常还没有。约束表只用来压住这类刚发布、镜像未同步的传递依赖版本，不是长期
# 策略；镜像追上后应该整体清空重新解析一次，删掉这个表。
constraint-dependencies = [
    "platformdirs<4.11.5",
    "pydantic<2.13.5",
    "typer<0.27.2",
    "wcwidth<0.8.3",
]

[tool.pytest.ini_options]
# 2026-08-28：测试单根合并，root tests/ 的测试代码已并入 apps/api/tests/
# （文件名碰撞的一个改名保留，冲突的旧夹具改名后一并搬入 conftest.py）。
# `tests/` 目录本身仍在——`tests/fixtures/documents/` 是共享 E2E 语料，不是
# 测试代码，pytest 不会从中收集用例（没有 test_*.py），保留不影响单根。
testpaths = ["apps/api/tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests against real Qwen-VL API (opt-in: pass -m e2e or --override-ini)",
]
